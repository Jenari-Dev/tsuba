[package]
name = "tsuba-gui"
description = "Tsuba — Kirigami desktop app for Razer devices (talks to tsubad over D-Bus)"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tsuba-app"
path = "src/main.rs"

[dependencies]
tsuba-core.workspace = true
tsuba-hid.workspace = true
cxx = "1.0.198"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
serde = "1.0.229"
serde_json = "1.0.154"
zbus = { version = "5.13.2", default-features = false, features = ["blocking-api", "async-io"] }

[build-dependencies]
cxx-qt-build = "0.10.0"
